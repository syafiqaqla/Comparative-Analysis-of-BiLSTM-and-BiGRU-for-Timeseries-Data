name: stock-prediction
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.10

  # Core Data Processing & Scientific Computing
  - numpy>=1.21.0
  - pandas>=1.3.0
  - scipy>=1.7.0
  - scikit-learn>=1.0.0

  # Deep Learning Framework
  - tensorflow>=2.10.0

  # Visualization & Plotting
  - matplotlib>=3.4.0
  - seaborn>=0.11.0
  - plotly>=5.0.0

  # Data Format Support
  - openpyxl>=3.6.0

  # Jupyter Notebook Support
  - jupyter>=1.0.0
  - ipykernel>=6.0.0
  - ipython>=7.0.0

  # Utilities
  - python-dateutil>=2.8.0

  # Optional: GPU support (uncomment if using CUDA/GPU)
  # - cudatoolkit=11.8
  # - cudnn=8.6

# pip dependencies (if any)
# pip:
#   - any-pip-package==version
